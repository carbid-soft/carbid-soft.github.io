<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — CARBID</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#0d141e; --card:#141f2d; --line:#233246; --text:#f2f5fa; --muted:#9db0c6; --accent:#c0e36a; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:"Segoe UI",system-ui,sans-serif; line-height:1.5; }
  main { max-width: 880px; margin: 0 auto; padding: 48px 16px 40px; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p.lead { color: var(--muted); margin: 0 0 28px; }
  .grid { display:grid; gap:16px; grid-template-columns: 1fr; }
  @media (min-width: 720px) { .grid { grid-template-columns: 1fr 1fr; } }
  a.card { display:block; text-decoration:none; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px; }
  a.card:hover, a.card:focus-visible { border-color: var(--accent); outline: none; }
  a.card h2 { margin:0 0 6px; font-size:20px; color:var(--accent); }
  a.card p { margin:0; color:var(--muted); }
  footer { margin-top: 32px; color: var(--muted); font-size: 14px; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Такой страницы нет</h1>
  <p class="lead">Возможно, адрес изменился. Начните с главной или откройте нужную программу.</p>
  <div class="grid">
    <a class="card" href="/pult/"><h2>Пульт продавца</h2><p>WB, Ozon и Яндекс Маркет в одном окне.</p></a>
    <a class="card" href="/vagony/"><h2>Вагоны</h2><p>Проверка претензий за простой вагонов.</p></a>
  </div>
  <footer><a href="/">На главную</a></footer>
</main>
</body>
</html>
